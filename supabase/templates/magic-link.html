<!doctype html>
<html lang="en">
  <body style="margin:0;padding:40px 24px;background:#0b0b0b;color:#eee;font-family:Arial,sans-serif;line-height:1.7">
    <div style="max-width:440px;margin:auto">
      <p style="font-size:14px;letter-spacing:4px">PARASENS</p>
      <h1 style="margin-top:48px;font-size:28px;font-weight:400">Sign in to your artist portal</h1>
      <p style="color:#aaa">Use the button below to continue securely. This link can only be used once.</p>
      <p style="margin:32px 0"><a href="{{ .SiteURL }}/portal/auth/confirm#token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;border:1px solid #eee;padding:14px 24px;color:#eee;text-decoration:none;font-size:12px;letter-spacing:2px">SIGN IN</a></p>
      <p style="color:#aaa;font-size:12px">If you didn’t request this email, you can ignore it.</p>
    </div>
  </body>
</html>
